<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bonpala — an offline Globasa practice app: 860 sentences to read, translate, and complete.">
  <title>Bonpala — Globasa practice</title>
  <link rel="icon" href="globasa.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="globasa-1867x2000.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="#/" aria-label="Bonpala dashboard">
        <span class="brand-mark" aria-hidden="true"><img src="globasa.svg" alt=""></span>
        <span class="brand-text">Bon<em>pala</em></span>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/grammar" data-nav="grammar">Grammar</a>
        <a href="#/dictionary" data-nav="dictionary">Dictionary</a>
        <a href="#/reference" data-nav="reference">Quick reference</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <span class="sync-indicator is-offline" id="cloud-sync-status" role="status" aria-live="polite" aria-label="Cloud sync offline" title="Cloud sync offline" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
          <path d="M20 4v7h-7"></path>
        </svg>
      </span>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
    </div>
  </header>

  <main class="shell view" id="view" tabindex="-1"></main>

  <footer class="shell footer">
    <p>Bonpala</p>
    <p class="footer-note">
      An unofficial practice companion for
      <a href="https://globasa.net" target="_blank" rel="noopener noreferrer">Globasa</a>.
      Grammar summarized from the
      <a href="https://xwexi.globasa.net/eng/gramati" target="_blank" rel="noopener noreferrer">Complete Globasa Grammar</a>;
      vocabulary from the official
      <a href="https://github.com/Globasa-Team/cdn-files/blob/main/api2/word-list.csv" target="_blank" rel="noopener noreferrer">word-list.csv</a>.
      Word lookups: <a href="https://menalari.globasa.net/eng/" target="_blank" rel="noopener noreferrer">Menalari</a>.
    </p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button class="dict-widget-toggle" id="dict-widget-toggle" type="button" aria-expanded="false" aria-controls="dict-widget" aria-keyshortcuts="Control+/ Meta+/" title="Dictionary (Ctrl + ⌘ + /)" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M8 7h8M8 11h6"></path></svg>
    <span>Dictionary</span>
    <kbd class="dict-widget-kbd" aria-hidden="true">Ctrl + ⌘ + /</kbd>
  </button>

  <aside class="dict-widget" id="dict-widget" role="dialog" aria-modal="false" aria-labelledby="dict-widget-title" hidden>
    <div class="dict-widget-head">
      <h2 id="dict-widget-title">Dictionary</h2>
      <button class="dict-widget-close" id="dict-widget-close" type="button" aria-label="Close dictionary">×</button>
    </div>
    <label class="sr-only" for="dict-widget-search">Search the dictionary</label>
    <input class="dict-widget-search" id="dict-widget-search" type="search" placeholder="Search Globasa or English…" autocomplete="off" spellcheck="false" aria-keyshortcuts="Control+/ Meta+/">
    <div class="dict-widget-results" id="dict-widget-results"></div>
  </aside>

  <noscript>
    <div class="shell noscript">This app needs JavaScript enabled to run.</div>
  </noscript>

  <script src="data/words.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="data/grammar.js"></script>
  <script src="data/tenses.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/normalize.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exercise-engine.js"></script>
  <script src="js/review.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
